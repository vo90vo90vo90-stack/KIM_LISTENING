<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
<title>KIM'S LISTENING</title>
<!--
  듣기 받아쓰기 (개인용 단일 HTML 앱)
  사용법
   1) 이 파일을 폰에 저장하고 크롬/삼성 인터넷으로 열어요.
   2) [영상] 탭 → "영상 만들기"에서 유튜브 링크와 문장(시작|종료|영어|한글)을 붙여넣어요.
   3) 문장을 눌러 듣고, 칸에 받아쓰기를 하고 채점해요.
  주의
   - 영상 재생은 유튜브 공식 플레이어를 쓰기 때문에 인터넷이 필요해요. (외부 코드는 이것 하나뿐)
   - 데이터는 이 브라우저에 저장돼요. [설정]에서 정기적으로 JSON 백업을 받아두세요.
-->
<style>
/* ===== 테마 (변수 10개) ===== */
:root{--bg:#fff;--c:#f5f5f6;--t:#111;--s:#76767c;--p:#111;--ln:#ececee;--soft:#ebebed;--g:#12a066;--r:#e5484d;--o:#f08c00;--b:#2f7df6;--bs:#e4efff;--y:#fee500}
@media(prefers-color-scheme:dark){:root{--bg:#0e0e10;--c:#1b1b1e;--t:#f5f5f5;--s:#a0a0a6;--p:#f5f5f5;--ln:#2a2a2e;--soft:#2a2a2e;--g:#3ccf8e;--r:#ff6b6f;--o:#ffb340;--b:#6aa8ff;--bs:#1b2b48}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
input,textarea{font:inherit;color:inherit}
label{display:block;font-size:13px;font-weight:600;color:var(--s);margin:10px 0 4px}
label:first-child{margin-top:0}

/* ===== 레이아웃 ===== */
#hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;height:calc(46px + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(6px,env(safe-area-inset-right)) 0 max(6px,env(safe-area-inset-left));background:var(--bg)}
#hb{display:none;width:44px;height:44px;font-size:30px;line-height:1}
#hb.on{display:block}
#ht{flex:1;padding-left:10px;font-size:18px;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ha{display:flex}
#ha button[data-a=skip]{text-decoration:none;font-size:30px;font-weight:600;line-height:1;min-width:60px;height:40px;margin-left:8px;border-radius:20px;background:var(--c)}
#ha button{min-width:44px;height:44px;padding:0 10px;color:var(--t);font-weight:600;font-size:15px}
main{padding:4px max(16px,env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;color:var(--s)}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--t);font-weight:700}
nav button.on svg{stroke-width:2.2}
body.nonav nav{display:none}
#cta{position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom));z-index:15;display:flex;gap:8px;padding:8px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));background:linear-gradient(rgba(0,0,0,0),var(--bg) 35%)}
#cta:empty{display:none}
body.nonav #cta{bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}

/* ===== 공통 컴포넌트 ===== */
.card{background:var(--c);border:0;border-radius:24px;padding:14px 18px;margin-bottom:8px}
.h1{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.25;margin:0 4px 10px}
.g1{background:linear-gradient(135deg,#ffe83a 0%,#f7f0c6 52%,#f1f1ef 100%)}
.g2{background:linear-gradient(135deg,#a8e4f6 0%,#e2edf0 55%,#f1f2f3 100%)}
.g3{background:linear-gradient(135deg,#c6ec7d 0%,#e7efdb 55%,#f1f1ee 100%)}
@media(prefers-color-scheme:dark){.g1{background:linear-gradient(135deg,#6e6200 0%,#2d2a14 58%,#1b1b1e 100%)}.g2{background:linear-gradient(135deg,#17586b 0%,#1c2c32 58%,#1b1b1e 100%)}.g3{background:linear-gradient(135deg,#3f6a12 0%,#232c1b 58%,#1b1b1e 100%)}}
.big{font-size:28px;font-weight:800;line-height:1.2;letter-spacing:-.04em}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:var(--p);color:var(--bg);font-size:12px;font-weight:700;margin-bottom:6px}
.q{font-size:19px;font-weight:700;margin-bottom:12px;line-height:1.4}
.sub{font-size:13px;color:var(--s)}
.grow{flex:1}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{flex:1;height:48px;border-radius:999px;background:var(--p);color:var(--bg);font-size:15px;font-weight:700;letter-spacing:-.01em}
.btn:active{filter:brightness(.95)}
.btn.sec{flex:0 0 auto;padding:0 20px;background:var(--soft);color:var(--t)}
.btn.mini{flex:1;height:42px;font-size:14px}
.btn.red{background:var(--r);color:#fff}
.chip{height:34px;padding:0 14px;border-radius:999px;background:var(--soft);border:0;font-size:13px;font-weight:600;color:var(--t)}
.chip.on{background:var(--p);color:var(--bg)}
.card .chip:not(.on){background:var(--bg)}
.in{width:100%;height:44px;border-radius:16px;border:1px solid var(--ln);background:var(--bg);padding:0 14px;font-size:15px;outline:0}
.in:focus{border-color:var(--t)}
textarea.in{height:auto;padding:12px 14px;resize:vertical;line-height:1.5}
.bar{height:6px;border-radius:4px;background:rgba(127,127,127,.2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--p);border-radius:4px;transition:width .3s}
.lnk{color:var(--t);text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:14px;padding:12px 0 0;text-align:left}
.warn{display:block;width:100%;text-align:left;padding:10px 16px;border-radius:24px;background:var(--c);border:0;color:var(--o);font-weight:600;margin-bottom:8px}
.empty{text-align:center;padding:22px 12px;color:var(--s);line-height:1.7}
.empty b{display:block;font-size:17px;color:var(--t);margin-bottom:6px}
.red{color:var(--r)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid2 .card{margin:0}
.num{font-size:21px;font-weight:800;letter-spacing:-.03em}
.tag{font-size:11px;font-weight:700;background:var(--p);color:var(--bg);border-radius:999px;padding:2px 9px;flex:none}

/* 목록 카드 */
.it{display:flex;align-items:center;padding:0;overflow:hidden}
.tap{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:48px;text-align:left}
.tap .tx{flex:1;min-width:0;font-size:15px;font-weight:600}
.tap .tx small{display:block;font-size:12px;color:var(--s);font-weight:400}
.no{flex:none;width:24px;height:24px;border-radius:50%;background:var(--bg);color:var(--s);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.no.d{background:var(--p);color:var(--bg)}
.dots{width:40px;align-self:stretch;color:var(--s);font-size:20px}

/* 홈 주간 */
.wkb{display:flex;justify-content:space-between;margin:8px 0 0}
.wkb div{flex:1;text-align:center;font-size:12px;color:var(--s)}
.wkb i{display:block;width:20px;height:20px;border-radius:50%;margin:2px auto 0;background:rgba(127,127,127,.18)}
.wkb i.on{background:var(--p)}
.hero .big{margin-top:2px}
.res{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.res .tx{flex:1;min-width:0}
.res small{display:block;font-size:13px;color:var(--t);opacity:.65;font-weight:600}
.res b{display:block;font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.3;margin:1px 0}
.res em{display:block;font-style:normal;font-size:13px;color:var(--t);opacity:.65;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .circ{width:40px;height:40px;flex:none}
.res .circ svg{width:20px;height:20px}
.vc{position:relative;padding:0;overflow:hidden}
.vc .vt{width:100%;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:14px 18px;text-align:left}
.vc .vt b{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.vc .vt span{font-size:13px;color:var(--t);opacity:.65}
.vc .dots{position:absolute;top:2px;right:2px;width:44px;height:44px;color:var(--t);opacity:.6;z-index:1}

/* 영상 플레이어 */
#ytbox{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:#000;margin-bottom:8px}
#ytbox::after{content:'영상을 불러오는 중…';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa4ae;font-size:13px;pointer-events:none}
#ytbox.rd::after{display:none}
#ytp,#ytbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#ytov{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
#ytov i{font-style:normal;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
#ytov i svg{width:20px;height:20px;fill:currentColor;margin-left:2px}
#ytbox.pl #ytov i{opacity:0}
#yte{display:none;position:absolute;inset:0;z-index:3;background:rgba(0,0,0,.86);color:#fff;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;font-size:14px;line-height:1.5}
#yte a,#yte button{display:inline-block;color:#fff;background:rgba(255,255,255,.18);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;text-decoration:none}

/* 재생 컨트롤 */
.vrow{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.vl{flex:0 0 calc(50% - 6px);min-width:0}
.vl #ytbox{margin-bottom:6px;border-radius:12px}
.vr{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.chip.sm{height:32px;padding:0 6px;font-size:12.5px;min-width:0}
.vr .row .chip.sm{flex:1}
.vr>.chip.sm{width:100%}
.circ{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--p);color:var(--bg)}
.circ svg{display:block;fill:currentColor}
.circ .i-pa{display:none}
.circ.pl .i-pa{display:block}
.circ.pl .i-pl{display:none}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(76px + env(safe-area-inset-bottom));z-index:16;width:54px;height:54px;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.wi[readonly]{text-decoration:underline dotted;text-underline-offset:5px;cursor:pointer}
.wmk{background:var(--bs);color:var(--b);border-radius:4px;padding:0 3px;font-style:normal}
.wex{color:var(--t);padding:8px 0;border-top:1px solid var(--ln);font-size:15px;line-height:1.5}.wex:first-child{border-top:0}.wex small{display:block;color:var(--s);font-size:13px}
.fab.rp{bottom:calc(140px + env(safe-area-inset-bottom));background:var(--c);color:var(--t);border:1px solid var(--ln);border-radius:50%;font-size:13px;font-weight:800}
.fab.rp:disabled{opacity:.35;box-shadow:none}
.fab svg{width:24px;height:24px}
.vl #yte{font-size:11px;padding:6px;gap:6px;overflow:auto}
.vl #yte a,.vl #yte button{padding:5px 8px;font-size:11px}
.adj{display:flex;flex-direction:column;gap:4px;padding:8px 14px}
.kol{font-size:12.5px;color:var(--s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 4px 6px}
.kol.x{white-space:normal;overflow:visible}
.lk{display:flex;gap:6px;margin-top:2px}.lk .chip{flex:1;padding:0 6px;font-size:12px}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}.sw .chip{padding:0;font-variant-numeric:tabular-nums}
.ar{display:flex;align-items:center;gap:8px}
.ar span{width:40px;font-size:14px;color:var(--s);font-weight:600}
.ar b{flex:1;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.ar button{width:56px;height:34px;border-radius:999px;background:var(--bg);font-weight:700;font-size:14px}
/* 받아쓰기 칸 */
.words{display:flex;flex-wrap:wrap;margin:-2px -2px}
.wd{display:flex;flex-direction:column;align-items:center;margin:1px 2px}
.wr{display:flex;align-items:center}
.wr b{font-size:17px;color:var(--s);font-weight:600}
.wi{height:42px;border-radius:14px;border:0;background:var(--bg);text-align:center;font-size:17px;padding:0 6px;outline:0;min-width:0;color:var(--t)}
.wi::placeholder{color:var(--s);opacity:.7}
.wi:focus{box-shadow:inset 0 0 0 2px var(--t)}
.wi.ok{background:var(--bs);color:var(--b);font-weight:700;animation:pop .28s}
.wi.bad{background:var(--bg);box-shadow:inset 0 0 0 2px var(--r);color:var(--r)}
.wi.rv{background:var(--bg);box-shadow:inset 0 0 0 2px var(--o);color:var(--o);font-weight:700}
.wk{font-size:12px;color:var(--s);height:22px;padding:3px 6px;font-weight:600}
@keyframes pop{50%{transform:scale(1.08)}}
.row2{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.en{font-size:18px;font-weight:700;line-height:1.5;margin-bottom:3px}
.ko{font-size:16px;color:var(--t);line-height:1.5;margin-bottom:2px}

/* 캘린더 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .w7{font-size:12px;color:var(--s);padding:4px 0}
.cd{aspect-ratio:1;border-radius:50%;font-size:14px;display:flex;align-items:center;justify-content:center}
.cd.has{background:#ffeb6b;color:#111;font-weight:800}
.cd.goal{background:var(--p);color:var(--bg);font-weight:800}
.cd.today{text-decoration:underline;text-underline-offset:4px;font-weight:800}
.cd.sel{outline:2px solid var(--t);outline-offset:1px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.mnav button{width:40px;height:40px;font-size:24px}
.mnav b{font-size:17px}

/* 만들기 미리보기 */
.pv{font-size:13px}
.pv .r{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--ln);align-items:flex-start}
.pv .r:first-child{border-top:0}
.pv .r button{flex:none;width:32px;height:32px;border-radius:50%;background:var(--p);color:var(--bg);font-size:12px}
.pv .tm{font-size:12px;color:var(--s)}
.pv .e{font-weight:600;font-size:14px;word-break:break-word}
.pv .er{color:var(--r);font-weight:600}
.fmt{font:13px/1.6 ui-monospace,Consolas,monospace;background:var(--bg);border-radius:12px;padding:10px 12px;color:var(--s);margin:8px 0}
#mk-tpl{font:13px/1.6 ui-monospace,Consolas,monospace;min-height:150px}

/* 시트 / 토스트 */
#mk{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
#mk.on{display:flex}
#sh{width:100%;max-height:88vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:14px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh-t{font-size:17px;font-weight:700;margin-bottom:6px;line-height:1.4}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 6px;font-size:15px;text-align:left;border-radius:12px}
.mi:active{background:var(--c)}
#ts{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;display:none;align-items:center;gap:12px;padding:10px 16px;border-radius:20px;background:#111;color:#fff;font-size:14px}
#ts.on{display:flex}
#ts button{margin-left:auto;color:var(--y);font-weight:700}
.foot{text-align:center;font-size:12px;color:var(--s);padding:8px 0 0;line-height:1.6}
@media(prefers-color-scheme:dark){.cd.has{background:#6e6200;color:#fee500}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header id="hd"><button id="hb" data-a="back" aria-label="뒤로">‹</button><div id="ht"></div><div id="ha"></div></header>
<main id="app"></main>
<div id="cta"></div>
<nav id="nav">
  <button data-a="tab" data-h="#/" data-t="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>홈</button>
  <button data-a="tab" data-h="#/vids" data-t="vids"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3.5"/><path d="M10.2 9.4v5.2l4.4-2.6z"/></svg>영상</button>
  <button data-a="tab" data-h="#/fav" data-t="fav"><svg viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></svg>복습</button>
  <button data-a="tab" data-h="#/log" data-t="log"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3.5"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>기록</button>
  <button data-a="tab" data-h="#/opt" data-t="opt"><svg viewBox="0 0 24 24"><path d="M4 12h1.5M8 8v8M12 4v16M16 8v8M20 12h-1.5"/></svg>최적화</button>
  <button data-a="tab" data-h="#/set" data-t="set"><svg viewBox="0 0 24 24"><path d="M5 8h8M18 8h1M5 16h1M10 16h9"/><circle cx="15.5" cy="8" r="2.3"/><circle cx="8" cy="16" r="2.3"/></svg>설정</button>
</nav>
<div id="mk" data-a="mclose"><div id="sh"></div></div>
<div id="ts"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>

<script>
/* ===== 유틸 ===== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=v=>Number(v)||0;
const fm=n=>N(n).toLocaleString('ko-KR');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ymd=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const nz=s=>String(s||'').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* 시간 "1:23.5" ⇄ 초 */
function pT(s){
  s=String(s).trim().replace(/：/g,':');
  if(!/^\d+(:\d{1,2}){0,2}(\.\d+)?$/.test(s))return NaN;
  let t=0;for(const x of s.split(':'))t=t*60+Number(x);return t;
}
function fT(t){
  const x=Math.round(Math.max(0,t)*10),m=Math.floor(x/600),r=(x%600)/10;
  return m+':'+(r<10?'0':'')+(Number.isInteger(r)?r:r.toFixed(1));
}
/* 유튜브 링크 → 영상 ID */
function ytId(u){
  u=String(u||'').trim();
  if(/^[\w-]{11}$/.test(u))return u;
  const m=u.match(/(?:youtu\.be\/|[?&]v=|\/(?:embed|shorts|live|v)\/)([\w-]{11})/);
  return m?m[1]:'';
}
/* 영어 문장 → 단어 조각 (앞뒤 문장부호는 칸 밖에 표시) */
function toks(e){
  return String(e||'').trim().split(/\s+/).filter(Boolean).map(w=>{
    const m=w.match(/^([^\p{L}\p{N}]*)(.*?)([^\p{L}\p{N}]*)$/u);
    return{pre:m[1],core:m[2],post:m[3]};
  }).filter(t=>t.core);
}

/* ===== DB (IndexedDB: cats=영상, items=문장, meta=설정/기록) ===== */
let db,cats=[],items=[],M={};
function openDB(){
  return new Promise((ok,no)=>{
    const r=indexedDB.open('dictation-db',1);
    r.onupgradeneeded=()=>{const d=r.result;['cats','items','meta'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'})})};
    r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);
  });
}
const store=(s,m)=>db.transaction(s,m).objectStore(s);
const all=s=>new Promise((ok,no)=>{const q=store(s,'readonly').getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const put=(s,o)=>new Promise((ok,no)=>{const q=store(s,'readwrite').put(o);q.onsuccess=()=>ok(o);q.onerror=()=>no(q.error)});
const del=(s,id)=>new Promise((ok,no)=>{const q=store(s,'readwrite').delete(id);q.onsuccess=()=>ok();q.onerror=()=>no(q.error)});
/* 여러 건을 한 번에 저장/삭제 */
function bulk(s,puts,dels){
  return new Promise((ok,no)=>{
    const t=db.transaction(s,'readwrite'),st=t.objectStore(s);
    (puts||[]).forEach(o=>st.put(o));(dels||[]).forEach(id=>st.delete(id));
    t.oncomplete=()=>ok();t.onerror=()=>no(t.error);
  });
}
async function reload(){
  cats=await all('cats');items=await all('items');M={};
  (await all('meta')).forEach(r=>M[r.id]=r.v);
}

function streak(){
  const d=M.days||{};let k=new Date();
  if(!(d[ymd(k)]&&d[ymd(k)].n>0))k.setDate(k.getDate()-1);
  let n=0;
  while(d[ymd(k)]&&d[ymd(k)].n>0){n++;k.setDate(k.getDate()-1)}
  return n;
}
function logDay(perfect){
  const d=M.days||{},k=ymd(),r=d[k]||{n:0,ok:0};
  r.n++;if(perfect)r.ok++;d[k]=r;mput('days',d);
}
function bkDays(){
  const ref=(M.bk&&M.bk.at)||M.first;
  return ref?dayDiff(ymd(),ref):0;
}

/* ===== 유튜브 플레이어 (구간 재생) ===== */
const PL={p:null,vid:'',ready:false,pending:false,seg:null,loop:false,st:-1,tm:0,t0:0,want:false,errc:0,onLoop:null,onCount:null};
const ytCbs=[];let ytTag=false;
function ytApi(ok,fail){
  if(window.YT&&YT.Player){ok();return}
  ytCbs.push(ok);
  if(ytTag)return;
  ytTag=true;
  window.onYouTubeIframeAPIReady=()=>ytCbs.splice(0).forEach(f=>f());
  const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';
  s.onerror=()=>{ytTag=false;ytCbs.length=0;fail()};
  document.head.appendChild(s);
  setTimeout(()=>{if(!(window.YT&&YT.Player)){ytTag=false;ytCbs.length=0;fail()}},12000);
}
PL.host=function(){
  const b=$('#ytbox');if(!b)return;
  if(!$('#ytp')){const d=document.createElement('div');d.id='ytp';b.prepend(d)}
};
PL.kill=function(){
  clearInterval(PL.tm);
  try{PL.p&&PL.p.destroy&&PL.p.destroy()}catch(e){}
  PL.p=null;PL.ready=false;PL.pending=false;PL.seg=null;PL.pend=null;PL.vid='';PL.st=-1;PL.errc=0;PL.want=false;
};
PL.use=function(vid){
  PL.host();
  if(!/^https?:$/.test(location.protocol)){PL.vid=vid;PL.fail('file');return}
  if(PL.pending){PL.vid=vid;return}
  if(PL.p&&PL.vid!==vid){
    PL.vid=vid;PL.errc=0;PL.seg=null;
    const e=$('#yte');if(e)e.style.display='none';
    if(PL.ready)PL.p.cueVideoById(vid);
    return;
  }
  if(!PL.p)PL.mount(vid);
};
PL.mount=function(vid){
  PL.vid=vid;PL.pending=true;PL.errc=0;
  ytApi(()=>{
    PL.pending=false;
    if(!$('#ytp'))return;
    const v0=PL.vid;
    PL.p=new YT.Player('ytp',{
      videoId:v0,width:'100%',height:'100%',
      playerVars:{playsinline:1,controls:0,rel:0,modestbranding:1,disablekb:1,fs:0,iv_load_policy:3},
      events:{
        onReady:()=>{
          PL.ready=true;const b=$('#ytbox');b&&b.classList.add('rd');
          if(PL.vid!==v0)PL.p.cueVideoById(PL.vid);
          if(PL.pend){const a=PL.pend;PL.pend=null;PL.play.apply(PL,a)}
        },
        onStateChange:e=>{
          PL.st=e.data;
          const b=$('#ytbox');b&&b.classList.toggle('pl',e.data===1);const tg=$('#tog');tg&&tg.classList.toggle('pl',e.data===1);const rp=$('#rep');if(rp)rp.disabled=e.data!==2;
          if(e.data===1&&PL.want){PL.want=false;PL.onCount&&PL.onCount()}
          if(e.data===0&&PL.seg){
            if(PL.loop){PL.p.seekTo(PL.seg.st,true);PL.p.playVideo();PL.onLoop&&PL.onLoop()}else PL.seg=null;
          }
        },
        onError:e=>PL.fail(e.data)
      }
    });
    clearInterval(PL.tm);PL.tm=setInterval(PL.tick,60);
  },()=>{PL.pending=false;PL.fail('net')});
};
PL.play=function(st,en,rate,loop){
  if(PL.errc)return;
  if(!PL.p||!PL.ready){PL.pend=[st,en,rate,loop];return}
  PL.seg={st,en};PL.loop=loop;PL.want=true;PL.t0=Date.now();
  try{PL.p.setPlaybackRate(rate)}catch(e){}
  PL.p.seekTo(st,true);PL.p.playVideo();
};
PL.stop=function(){
  PL.seg=null;PL.pend=null;
  try{PL.p&&PL.ready&&PL.p.pauseVideo()}catch(e){}
};
PL.tick=function(){
  if(!PL.p||!PL.ready||!PL.seg||PL.st!==1||Date.now()-PL.t0<300)return;
  let t;try{t=PL.p.getCurrentTime()}catch(e){return}
  if(t>=PL.seg.en){
    if(PL.loop){PL.t0=Date.now();PL.p.seekTo(PL.seg.st,true);PL.onLoop&&PL.onLoop()}
    else{PL.p.pauseVideo();PL.seg=null}
  }
};
PL.fail=function(code){
  PL.errc=code||1;PL.pending=false;
  const e=$('#yte');if(!e)return;
  const msg=code==='file'?'파일로 열면 유튜브가 영상 재생을 막아요.<br>웹 주소(https)로 열어야 재생돼요.<br><small>설정 > 재생이 안 될 때 참고</small>'
    :code==='net'?'유튜브 플레이어를 불러오지 못했어요.<br>인터넷 연결을 확인해 주세요.'
    :(code===101||code===150)?'이 영상은 퍼가기가 막혀 있어서<br>앱 안에서 재생할 수 없어요.'
    :code===100?'영상을 찾을 수 없어요.<br>링크를 다시 확인해 주세요.'
    :'영상을 재생하지 못했어요.<br>(파일로 열면 유튜브가 막는 경우도 있어요)';
  const t=S&&S.sid&&itemOf(S.sid);
  const link=PL.vid?'https://www.youtube.com/watch?v='+encodeURIComponent(PL.vid)+(t?'&t='+Math.floor(t.st)+'s':''):'';
  e.innerHTML='<div>'+msg+'</div><div class="row" style="justify-content:center"><button data-a="plretry">다시 시도</button>'+(link?'<a href="'+esc(link)+'" target="_blank" rel="noopener">유튜브에서 열기</a>':'')+'</div>';
  e.style.display='flex';
  const b=$('#ytbox');if(b)b.classList.add('rd');
};

/* ===== 라우터 ===== */
let SCR={},CURP='#/',S=null,FQ=[];
const ROUTES=[
  [/^#\/$/,'home'],[/^#\/vids$/,'vids'],[/^#\/vid\/([^/]+)$/,'vidScr'],
  [/^#\/study\/([^/]+)\/([^/]+)$/,'studyScr'],[/^#\/make(?:\/([^/]+))?$/,'makeScr'],
  [/^#\/fav$/,'favScr'],[/^#\/log$/,'logScr'],[/^#\/opt$/,'optScr'],[/^#\/set$/,'setScr']
];
const FN={};
function route(){
  PL.kill();clearInterval(OP.tm);
  const h=location.hash||'#/';
  for(const[re,name]of ROUTES){
    const m=h.match(re);
    if(m){
      FN[name].apply(null,m.slice(1).map(x=>x==null?x:decodeURIComponent(x)));
      const tab=/^#\/(vids|vid|study|make)/.test(h)?'vids':/^#\/fav/.test(h)?'fav':/^#\/log/.test(h)?'log':/^#\/opt/.test(h)?'opt':/^#\/set/.test(h)?'set':'home';
      $$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
      scrollTo(0,SCR[h]||0);
      mput('ui',Object.assign({},M.ui,{route:h}));
      return;
    }
  }
  goR('#/');
}
function go(h){
  if(h===location.hash){route();return}
  SCR[location.hash]=scrollY;
  const d=(history.state&&history.state.d)||0;
  history.pushState({d:d+1},'',h);SCR[h]=0;route();
}
function goR(h){
  history.replaceState({d:(history.state&&history.state.d)||0},'',h);route();
}
function backNav(){
  const d=(history.state&&history.state.d)||0;
  if(d>0)history.back();else goR(CURP||'#/');
}
function view(title,o){
  o=o||{};
  document.body.classList.toggle('nonav',!!o.nonav);
  $('#ht').textContent=o.big?'':title;
  $('#hb').classList.toggle('on',!!o.back);
  $('#ha').innerHTML=o.ha||'';
  $('#app').innerHTML=(o.big?'<h1 class="h1">'+esc(title)+'</h1>':'')+(o.html||'');
  $('#cta').innerHTML=o.cta||'';
  CURP=o.parent||'#/';
}
let lastBack=0;
addEventListener('popstate',e=>{
  if(MOPEN){hideM();const f=PEND;PEND=null;if(f)f();return}
  if(e.state&&e.state.base){

    lastBack=Date.now();toast('한 번 더 누르면 종료돼요');

function resume(){
  const last=M.ui&&M.ui.last,li=last&&itemOf(last.sid);
  if(li&&vidOf(li.cid)){
    const L=itemsOf(li.cid),i=L.findIndex(x=>x.id===li.id),t=L[i+1]||L[i];
    return{id:t.id,cid:t.cid,k:t.k};
  }
  for(const c of cats){const L=itemsOf(c.id);if(L.length)return{id:L[0].id,cid:c.id,k:L[0].k,fresh:1}}
  return null;
}

function mkParse(txt){
  const rows=[];
  String(txt).split(/\r?\n/).forEach((ln,i)=>{
    if(!ln.trim()||ln.trim()[0]==='#')return;
    const p=(ln.includes('|')?ln.split('|'):ln.split('\t')).map(x=>x.trim()),r={n:i+1};
    if(p.length<3){r.err='칸이 모자라요 (시작 | 종료 | 영어 | 한글)';rows.push(r);return}
    r.st=pT(p[0]);r.en=pT(p[1]);r.e=p[2];r.k=p.slice(3).join(' | ');
    if(isNaN(r.st)||isNaN(r.en))r.err='시간 형식을 확인해 주세요 (예: 1:23)';
    else if(r.en<=r.st)r.err='종료가 시작보다 늦어야 해요';
    else if(!toks(r.e).length)r.err='영어 문장이 비어 있어요';
    rows.push(r);
  });
  return rows;
}

async function mergeData(o){
  if(!o||o.app!=='dictation')throw new Error('app');
  const cm={},im={},newC=[],newI=[],touched=[];let add=0,dup=0;
  const sig=(cid,x)=>cid+'|'+x.st+'|'+x.en+'|'+nz(x.e);
  (o.cats||[]).forEach(c=>{
    const ex=cats.find(x=>x.id===c.id)||cats.find(x=>x.vid===c.vid&&x.title===c.title)||newC.find(x=>x.vid===c.vid&&x.title===c.title);
    if(ex){cm[c.id]=ex.id;return}
    const n=Object.assign({},c);
    if(cats.some(x=>x.id===n.id)||newC.some(x=>x.id===n.id))n.id=uid();
    cm[c.id]=n.id;newC.push(n);
  });
  (o.items||[]).forEach(i=>{
    const cid=cm[i.cid];if(!cid)return;
    const s=sig(cid,i);
    const ex=items.find(x=>x.id===i.id&&x.cid===cid)||items.find(x=>sig(x.cid,x)===s)||newI.find(x=>sig(x.cid,x)===s);
    if(ex){
      im[i.id]=ex.id;dup++;
      if(i.fav&&!ex.fav){ex.fav=true;ex.fa=i.fa||Date.now();touched.push(ex)}
      if(N(i.miss)>N(ex.miss)){ex.miss=i.miss;touched.push(ex)}
      if(N(i.done)>N(ex.done)){ex.done=i.done;touched.push(ex)}
      return;
    }
    const n=Object.assign({},i,{cid:cid});
    if(items.some(x=>x.id===n.id)||newI.some(x=>x.id===n.id))n.id=uid();
    im[i.id]=n.id;newI.push(n);add++;
  });
  const days=M.days||{};
  Object.keys(o.days||{}).forEach(k=>{
    const v=o.days[k],c=days[k];
    if(!c)days[k]={n:N(v.n),ok:N(v.ok)};else{c.n=Math.max(N(c.n),N(v.n));c.ok=Math.max(N(c.ok),N(v.ok))}
  });
  /* 단어장: 같은 단어는 합치고 문장 연결(refs)은 새 ID로 바꿔요 */
  const wl=WD().map(w=>Object.assign({},w,{refs:(w.refs||[]).slice()}));let wch=false;
  (o.words||[]).forEach(w=>{
    if(!w||!w.w)return;
    const rf=(w.refs||[]).map(r=>im[r]||r),ex=wl.find(x=>nz(x.w)===nz(w.w));
    if(ex){
      dup++;
      if(!ex.m&&w.m){ex.m=w.m;wch=true}
      if(!ex.x&&w.x){ex.x=w.x;wch=true}
      if(!(ex.d&&ex.d.length)&&w.d&&w.d.length){ex.d=w.d;ex.ex=w.ex||[];ex.ph=w.ph||'';wch=true}
      rf.forEach(r=>{if(!ex.refs.includes(r)){ex.refs.push(r);wch=true}});
    }else{wl.push({id:wl.some(x=>x.id===w.id)?uid():(w.id||uid()),w:w.w,m:w.m||'',x:w.x||'',d:w.d||[],ex:w.ex||[],ph:w.ph||'',refs:rf,t:w.t||Date.now()});add++;wch=true}
  });
  if(wch)await mput('words',wl);
  await bulk('cats',newC);await bulk('items',newI.concat(touched));await mput('days',days);await reload();
  return{add:add,dup:dup};
}

function hiW(text,w){
  const re=new RegExp("(^|[^A-Za-z'])("+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+")(?![A-Za-z'])",'i');
  const m=re.exec(text);if(!m)return esc(text);
  const a=m.index+m[1].length;
  return esc(text.slice(0,a))+'<mark class="wmk">'+esc(m[2])+'</mark>'+esc(text.slice(a+m[2].length));
}
/* 영어 뜻: 무료 사전(dictionaryapi.dev, 키 없음). 한 번 불러오면 단어장에 저장해서 인터넷 없이도 봐요 */
const DC={};let DCUR=null;
function dictParse(j){
  const e=j&&j[0];if(!e)return null;
  const ph=e.phonetic||((e.phonetics||[]).find(p=>p.text)||{}).text||'';
  const defs=[],ex=[];
  (e.meanings||[]).slice(0,3).forEach(m=>{
    (m.definitions||[]).slice(0,2).forEach(d=>{
      if(d.definition)defs.push({p:m.partOfSpeech||'',d:d.definition});
      if(d.example&&ex.length<3&&!ex.includes(d.example))ex.push(d.example);
    });
  });
  return defs.length?{ph:ph,defs:defs,ex:ex}:null;
}
async function dictGet(w){
  const k=nz(w),sv=wfind(w);
  if(sv&&sv.d&&sv.d.length)return{ph:sv.ph||'',defs:sv.d,ex:sv.ex||[]};
  if(DC[k])return DC[k];
  const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),7000);
  try{
    const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w.toLowerCase()),{signal:ac.signal});
    if(!r.ok)throw new Error('nf');
    const d=dictParse(await r.json());
    if(!d)throw new Error('nf');
    return DC[k]=d;
  }finally{clearTimeout(tm)}
}
function dictHTML(d,w){
  return (d.ph?'<div class="sub">'+esc(d.ph)+'</div>':'')
    +d.defs.map(x=>'<div class="wex">'+(x.p?'<small style="display:inline;margin-right:6px">'+esc(x.p)+'</small>':'')+esc(x.d)+'</div>').join('')
    +(d.ex.length?'<div class="sub" style="margin-top:8px">예문</div>'+d.ex.map(t=>'<div class="wex" style="font-style:italic">'+hiW(t,w)+'</div>').join(''):'');
}

const lk=(a,b)=>!b.ul&&Math.abs(a.en-b.st)<0.06;  /* 앞 문장 끝 = 뒤 문장 시작이면 '연결' */
function linkTog(it,k){
  const L=itemsOf(it.cid),j=L.findIndex(x=>x.id===it.id);
  const e=k==='p'?L[j-1]:it,l=k==='p'?it:L[j+1];
  if(!e||!l){toast('이어진 문장이 없어요');return}
  if(lk(e,l)){l.ul=true;put('items',l);toast('개별로 바꿨어요. 따로 움직여요')}
  else{
    if(l.st-e.st<0.5){toast('앞 문장이 너무 짧아서 연동할 수 없어요');return}
    e.en=l.st;l.ul=false;put('items',e);put('items',l);toast('연동했어요. 앞 문장 끝 = 뒤 문장 시작');
  }
}

  },

  adj:a=>{
    const it=ci(),k=a.dataset.k,v=Number(a.dataset.v),r=x=>Math.round(x*10)/10;
    const L=itemsOf(it.cid),j=L.findIndex(x=>x.id===it.id),pv=L[j-1],nx=L[j+1];

        ch=nx;ch.st=en;

    const it=ci();linkTog(it,a.dataset.k);adjPaint();
  },
  kotog:()=>{if(!S)return;S.kow=!S.kow;const e=$('.kol');if(e)e.classList.toggle('x',!!S.kow)},
  /* 최적화 */
  optplay:()=>{
    const it=itemsOf(OP.cid)[OP.i];if(!it||!$('#opcard'))return;
    if(PL.p&&PL.ready&&PL.seg&&PL.st===1){try{PL.p.pauseVideo()}catch(e){}return}
    if(PL.p&&PL.ready&&PL.seg&&PL.st===2){PL.want=false;try{PL.p.playVideo()}catch(e){}return}
    optStart(OP.i);
  },
  opskip:a=>{
    const L=itemsOf(OP.cid),j=OP.i+Number(a.dataset.d);
    if(j<0||j>=L.length){toast(j<0?'첫 문장이에요':'마지막 문장이에요');return}
    optStart(j);
  },
  opscope:()=>{OP.from=!OP.from;paintOpt()},
  opshift:a=>optShift(Number(a.dataset.v)),
  opnow:()=>{
    const it=itemsOf(OP.cid)[OP.i];let t=NaN;
    try{if(PL.p&&PL.ready)t=PL.p.getCurrentTime()}catch(e){}
    if(!it||isNaN(t)){toast('영상을 재생하는 중에 눌러 주세요');return}
    const d=Math.round((t-it.st)*10)/10;
    if(!d){toast('이미 맞아요');return}
    optShift(d);
  },
  loop:()=>{const v=!set().loop;setSave({loop:v});PL.loop=v;if(inOpt())paintOpt();else if(S&&/^#\/study/.test(location.hash))paintCtl();else FN.setScr()},
  rate:a=>{
    const r=Number(a.dataset.r);setSave({rate:r});
    try{PL.p&&PL.ready&&PL.p.setPlaybackRate(r)}catch(e){}
    if(inOpt())paintOpt();else if(S&&/^#\/study/.test(location.hash))paintCtl();else FN.setScr();
  },
  hint:()=>{if(S.hint<2){S.hint++;S.hinted=true;paintStudy()}},
  star:()=>{
    const it=cur();it.fav=!it.fav;it.fa=it.fav?Date.now():0;put('items',it);
    toast(it.fav?'복습에 담았어요':'복습에서 뺐어요');paintStudy();
  },
  unfav:()=>{const it=cur();it.fav=false;put('items',it);toast('복습에서 뺐어요',()=>{it.fav=true;it.fa=Date.now();put('items',it);if(S&&S.sid===it.id)paintStudy()});paintStudy()},
  grade:()=>grade(),
  giveup:()=>{
    S.tk.forEach((t,i)=>{if(S.gr[i]!=='ok'){S.gr[i]='rv';S.vals[i]=t.core}});
    S.rvd=true;markMiss();finish();
  },
  rvw:a=>{
    const i=Number(a.dataset.i);S.gr[i]='rv';S.vals[i]=S.tk[i].core;S.rvd=true;markMiss();
    if(S.gr.every(g=>g==='ok'||g==='rv'))finish();else paintStudy();
  },
  snext:()=>studyGo(1),
  retry:()=>{
    Object.assign(S,{vals:[],gr:[],st:'in',hint:0,hinted:false,rvd:false,tries:0,perfect:false});
    clearTimeout(dfT);mput('draft',null);paintStudy(true);
  },
  word:a=>{const t=S&&S.tk[Number(a.dataset.i)];if(t)openWord(t.core,S.sid)},
  wsave:a=>{
    const w=a.dataset.w,sid=a.dataset.sid,m=$('#wd-m').value.trim();
    const L=WD().slice();let e=L.find(v=>nz(v.w)===nz(w));
    const dc=DCUR&&DCUR.k===nz(w)?DCUR.d:null;
    if(e){e.m=m;if(sid&&!e.refs.includes(sid))e.refs.push(sid);if(dc){e.d=dc.defs;e.ex=dc.ex;e.ph=dc.ph}}
    else L.unshift({id:uid(),w:w,m:m,x:'',d:dc?dc.defs:[],ex:dc?dc.ex:[],ph:dc?dc.ph:'',refs:sid?[sid]:[],t:Date.now()});
    mput('words',L);toast('단어장에 담았어요');
    closeM(()=>{if(location.hash==='#/fav')FN.favScr()});
  },
  wdel:a=>{
    const w=a.dataset.w,old=WD().slice();
    mput('words',old.filter(v=>nz(v.w)!==nz(w)));
    closeM(()=>{if(location.hash==='#/fav')FN.favScr();toast('단어장에서 뺐어요',()=>{mput('words',old);if(location.hash==='#/fav')FN.favScr()})});
  },
  ftab:a=>{FVT=a.dataset.t;FN.favScr()},
  wopen:a=>{const e=WD().find(v=>v.id===a.dataset.id);if(e)openWord(e.w,wsrc(e))},
  wstudy:a=>{
    const e=WD().find(v=>v.id===a.dataset.id),sid=e&&wsrc(e),it=sid&&itemOf(sid);
    if(!it){toast('이 단어의 원래 문장이 삭제됐어요');return}
    go('#/study/'+encodeURIComponent(it.cid)+'/'+encodeURIComponent(it.id));
  },
  skip:a=>studyGo(Number(a.dataset.d)),
  plretry:()=>{
    const v=PL.vid;PL.kill();PL.host();
    const e=$('#yte');if(e)e.style.display='none';
    const b=$('#ytbox');if(b)b.classList.remove('rd');
    PL.use(v);
    if(S&&S.sid&&/^#\/study/.test(location.hash)){const it=cur(),s=set();PL.play(it.st,it.en,s.rate,s.loop)}
  },
  /* 캘린더 */
  calmv:a=>{
    const ym=(M.ui&&M.ui.cal)||ymd().slice(0,7);let[y,m]=ym.split('-').map(Number);
    m+=Number(a.dataset.v);if(m<1){m=12;y--}if(m>12){m=1;y++}
    mput('ui',Object.assign({},M.ui,{cal:y+'-'+String(m).padStart(2,'0')}));calSel=null;FN.logScr();
  },
  calday:a=>{calSel=a.dataset.d;FN.logScr()},
  repn:a=>{setSave({rep:Number(a.dataset.n)});FN.setScr()},
  goal:a=>{setSave({goal:Math.min(100,Math.max(1,set().goal+Number(a.dataset.v)))});FN.setScr()},
  /* 만들기 */
  mksample:()=>{
    const t=$('#mk-tpl');
    if(t.value.trim()){toast('이미 내용이 있어요. 먼저 비워 주세요');return}
    t.value=SAMPLE;mkPreview();
  },
  mkclear:()=>{
    if(!confirm('입력한 내용을 모두 비울까요?'))return;
    $('#mk-url').value='';$('#mk-title').value='';$('#mk-tpl').value='';mkPreview();
  },
  mkplay:a=>{const r=MK.rows[Number(a.dataset.i)];if(r&&!r.err){if(PL.errc){toast('영상을 재생할 수 없어요. 링크를 확인해 주세요');return}PL.play(r.st,r.en,1,false)}},
  mksave:()=>mkSave(),
  /* 메뉴 */
  vmenu:a=>{
    const c=vidOf(a.dataset.id);
    openM('<div class="sh-t">'+esc(c.title)+'</div><button class="mi" data-a="vedit" data-id="'+c.id+'">수정하기</button>'
      +'<button class="mi" data-a="vexp" data-id="'+c.id+'">이 영상 내보내기 (JSON)</button>'
      +'<button class="mi red" data-a="vdel" data-id="'+c.id+'">영상 삭제</button>');
  },
  vedit:a=>closeM(()=>go('#/make/'+a.dataset.id)),
  vexp:a=>closeM(()=>{
    const c=vidOf(a.dataset.id);
    dl(JSON.stringify(pack([c],itemsOf(c.id),{})),'받아쓰기영상_'+c.title.replace(/[\\/:*?"<>|]/g,'_')+'_'+ymd()+'.json');
    toast('영상 파일을 저장했어요');
  }),
  vdel:a=>closeM(async()=>{
    const c=vidOf(a.dataset.id),L=itemsOf(c.id);
    if(!confirm('「'+c.title+'」과 문장 '+L.length+'개(복습에 담긴 것 '+L.filter(i=>i.fav).length+'개)가 삭제돼요. 삭제할까요?'))return;
    await del('cats',c.id);await bulk('items',[],L.map(i=>i.id));await reload();route();
    toast('영상을 삭제했어요',async()=>{await put('cats',c);await bulk('items',L);await reload();route()});
  }),
  smenu:a=>{
    const i=itemOf(a.dataset.id),f=!!a.dataset.f;
    openM('<div class="sh-t">'+esc(i.k||i.e)+'</div><button class="mi" data-a="sedit" data-id="'+i.id+'">수정하기</button>'
      +(f?'<button class="mi red" data-a="sfav" data-id="'+i.id+'">복습에서 삭제</button>'
         :'<button class="mi" data-a="sfav" data-id="'+i.id+'">'+(i.fav?'복습에서 빼기':'복습에 담기')+'</button><button class="mi red" data-a="sdel" data-id="'+i.id+'">문장 삭제</button>'));
  },
  sedit:a=>editSheet(a.dataset.id),
  esave:async a=>{
    const i=itemOf(a.dataset.id),st=pT($('#es-st').value),en=pT($('#es-en').value),e=$('#es-e').value.trim();
    if(isNaN(st)||isNaN(en)){toast('시간 형식을 확인해 주세요 (예: 1:23)');return}
    if(en<=st){toast('종료가 시작보다 늦어야 해요');return}
    if(!toks(e).length){toast('영어 문장을 입력해 주세요');return}
    Object.assign(i,{st:st,en:en,e:e,k:$('#es-k').value.trim()});
    await put('items',i);closeM(()=>{route();toast('수정했어요')});
  },
  sfav:a=>closeM(()=>{
    const i=itemOf(a.dataset.id),was=i.fav;
    i.fav=!was;i.fa=i.fav?Date.now():0;put('items',i);route();
    toast(i.fav?'복습에 담았어요':'복습에서 뺐어요',()=>{i.fav=was;i.fa=was?Date.now():0;put('items',i);route()});
  }),
  sdel:a=>closeM(()=>{
    const i=itemOf(a.dataset.id);
    del('items',i.id).then(()=>reload()).then(()=>{route();toast('문장을 삭제했어요',async()=>{await put('items',i);await reload();route()})});
  })
};
document.addEventListener('change',e=>{
  if(e.target.id==='optsel'){OP.cid=e.target.value;OP.i=0;route()}
});
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');
  if(!a||a.disabled)return;
  const f=ACT[a.dataset.a];
  if(f){e.preventDefault();f(a,e)}
});

/* 입력 처리: 받아쓰기 칸 / 만들기 폼 */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList.contains('wi')&&S){
    if(/\s/.test(t.value)){
      t.value=t.value.replace(/\s+/g,'');
      const ins=$$('.wi:not([readonly])'),k=ins.indexOf(t);
      if(ins[k+1])ins[k+1].focus();
    }
    S.vals[Number(t.dataset.i)]=t.value;
    saveDraft(()=>({k:'s',sid:S.sid,vals:S.vals.slice()}));
  }else if(t.id==='mk-url'||t.id==='mk-tpl'||t.id==='mk-title')mkPreview();
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(!t.classList||!t.classList.contains('wi'))return;
  const ins=$$('.wi:not([readonly])'),k=ins.indexOf(t);
  if(e.key==='Enter'){
    e.preventDefault();
    if(k<ins.length-1)ins[k+1].focus();else grade();
  }else if(e.key==='Backspace'&&!t.value&&k>0){e.preventDefault();ins[k-1].focus()}
});

/* ===== 시작 ===== */
(async function start(){
  if(!window.indexedDB){
    $('#app').innerHTML='<div class="card empty"><b>저장소를 쓸 수 없어요</b>이 브라우저에서는 데이터를 저장할 수 없어요.<br>시크릿 모드를 끄고 다시 열어 주세요.</div>';return;
  }
  try{db=await openDB();await reload()}
  catch(e){$('#app').innerHTML='<div class="card empty"><b>저장소를 열지 못했어요</b>브라우저를 다시 시작해 주세요.</div>';return}
  if(!M.first)await mput('first',ymd());
  history.scrollRestoration='manual';
  const h='#/';   /* 앱을 다시 열면 항상 홈에서 시작해요 */
  history.replaceState({base:1,d:0},'',h);
  history.pushState({d:0},'',h);
  route();
})();
</script>
